name: Clear ECS Resources

on:
  workflow_dispatch:
    inputs:
      cluster_name:
        description: 'ECS Cluster name to clear resources from'
        required: true
        type: string
      service_name:
        description: 'ECS Service name to scale down'
        required: true
        type: string
  workflow_call:
    inputs:
      cluster_name:
        description: 'ECS Cluster name to clear resources from'
        required: true
        type: string
      service_name:
        description: 'ECS Service name to scale down'
        required: true
        type: string

env:
  AWS_REGION: ap-southeast-1

jobs:
  clear-resources:
    runs-on: ubuntu-latest
    
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: false
          
      - name: Scale down old service
        run: |
          echo "Scaling service ${{ inputs.service_name }} in cluster ${{ inputs.cluster_name }} to 0 desired count..."
          aws ecs update-service \
            --cluster "${{ inputs.cluster_name }}" \
            --service "${{ inputs.service_name }}" \
            --desired-count 0
          
          echo "Service ${{ inputs.service_name }} successfully scaled to 0."