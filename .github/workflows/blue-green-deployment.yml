name: Complete Blue-Green Deployment

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to deploy'
        required: true
        type: string
      target_env:
        description: 'Target environment for deployment (blue or green)'
        required: true
        type: choice
        options:
          - blue
          - green
      switch_traffic:
        description: 'Switch traffic after deployment'
        required: false
        type: boolean
        default: false
      cleanup_old_service:
        description: 'Scale down old service after traffic switch'
        required: false
        type: boolean
        default: false

env:
 
  CLUSTER_NAME: greenmart-cluster-v2 
  BLUE_SERVICE: greenmart-service-blue
  GREEN_SERVICE: greenmart-service-green

jobs:
  build-and-push:
    uses: ./.github/workflows/build-docker.yml
    with:
      version: ${{ inputs.version }}
    secrets: inherit

  deploy-to-target:
    needs: build-and-push
    uses: ./.github/workflows/deploy-ecs.yml
    with:
      version: ${{ inputs.version }}
      cluster_name: greenmart-cluster-v2 
      service_name: ${{ inputs.target_env == 'blue' && 'greenmart-service-blue' || 'greenmart-service-green' }}
    secrets: inherit

  manual-approval:
    if: ${{ inputs.switch_traffic }}
    needs: deploy-to-target
    runs-on: ubuntu-latest
    environment: production-approval
    steps:
      - name: Manual Approval Required
        run: |
          echo "## 🚀 Ready to Switch Traffic" >> $GITHUB_STEP_SUMMARY
          echo "Deployment to ${{ inputs.target_env }} service completed successfully." >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Target Service:** ${{ inputs.target_env == 'blue' && env.BLUE_SERVICE || env.GREEN_SERVICE }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Please review the deployment and approve to switch traffic." >> $GITHUB_STEP_SUMMARY

  switch-traffic:
    if: ${{ inputs.switch_traffic }}
    needs: manual-approval
    uses: ./.github/workflows/switch-traffic.yml
    with:
      # Truyền target_env để job switch-traffic biết cần trỏ Load Balancer vào đâu
      target_env: ${{ inputs.target_env }}
    secrets: inherit

  cleanup-old-service:
    if: ${{ inputs.cleanup_old_service && inputs.switch_traffic }}
    needs: switch-traffic
    uses: ./.github/workflows/clear-resources.yml
    with:
      cluster_name: greenmart-cluster
      # Logic Dọn dẹp: Tìm service NGƯỢC LẠI với target_env. Nếu deploy lên blue thì xóa green.
      service_name: ${{ inputs.target_env == 'blue' && 'greenmart-service-green' || 'greenmart-service-blue' }}
    secrets: inherit

  deployment-summary:
    needs: [build-and-push, deploy-to-target]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Deployment Summary
        run: |
          echo "## Blue-Green Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Environment:** ${{ inputs.target_env }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Traffic Switched:** ${{ inputs.switch_traffic }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Old Service Cleaned:** ${{ inputs.cleanup_old_service }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Status:** ${{ needs.build-and-push.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deploy Status:** ${{ needs.deploy-to-target.result }}" >> $GITHUB_STEP_SUMMARY