services:

  web:
    build: .
    container_name: greenmart_web
    expose:
      - "8000"
    volumes:
      - .:/app
      - static_volume:/staticfiles
      - media_volume:/media

  nginx:
    image: nginx:alpine
    container_name: greenmart_nginx
    ports:
      - "8088:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./staticfiles:/staticfiles
      - ./media:/media
    depends_on:
      - web

volumes:
  static_volume:
  media_volume:

