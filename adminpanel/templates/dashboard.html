<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Trang Quản Trị</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex">

  <!-- Sidebar -->
  <aside class="w-64 bg-white h-screen shadow-lg p-5">
    <h2 class="text-2xl font-bold text-green-600 mb-8">GreenMart Admin</h2>
    <nav class="space-y-3">
      <a href="{% url 'admin_dashboard' %}" class="block px-3 py-2 rounded hover:bg-green-100">🏠 Dashboard</a>
      <a href="{% url 'admin_products' %}" class="block px-3 py-2 rounded hover:bg-green-100">📦 Sản phẩm</a>
      <a href="{% url 'admin_orders' %}" class="block px-3 py-2 rounded hover:bg-green-100">🛒 Đơn hàng</a>
      <a href="{% url 'admin_promotion' %}" class="block px-3 py-2 rounded hover:bg-green-100">🎁 Khuyến mãi</a>
      <a href="{% url 'admin_users' %}" class="block px-3 py-2 rounded hover:bg-green-100">👤 Người dùng</a>
      <a href="{% url 'logout' %}" class="block px-3 py-2 rounded hover:bg-green-100">↩️ Đăng xuất</a>
    </nav>
  </aside>

  <!-- Main content -->
  <main class="flex-1 p-10">
    <h1 class="text-3xl font-semibold mb-6">📊 Thống kê tổng quan</h1>

    <!-- Cards -->
    <div class="grid grid-cols-4 gap-6 mb-10">
      <div class="bg-white p-5 rounded-lg shadow">
        <h2 class="text-gray-500 text-sm">Sản phẩm</h2>
        <p class="text-2xl font-bold text-green-600">{{ product_count }}</p>
      </div>
      <div class="bg-white p-5 rounded-lg shadow">
        <h2 class="text-gray-500 text-sm">Danh mục</h2>
        <p class="text-2xl font-bold text-green-600">{{ category_count }}</p>
      </div>
      <div class="bg-white p-5 rounded-lg shadow">
        <h2 class="text-gray-500 text-sm">Đơn hàng</h2>
        <p class="text-2xl font-bold text-green-600">{{ order_count }}</p>
      </div>
      <div class="bg-white p-5 rounded-lg shadow">
        <h2 class="text-gray-500 text-sm">Người dùng</h2>
        <p class="text-2xl font-bold text-green-600">{{ user_count }}</p>
      </div>
    </div>

    <!-- Biểu đồ -->
    <div class="bg-white p-6 rounded-lg shadow">
      <h2 class="text-lg font-semibold mb-4">Doanh thu theo tháng</h2>
      <canvas id="revenueChart" height="100"></canvas>
    </div>
  </main>

  <script>
    const ctx = document.getElementById('revenueChart');
    new Chart(ctx, {
      type: 'line',
      data: {
        labels: ['Th1', 'Th2', 'Th3', 'Th4', 'Th5', 'Th6'],
        datasets: [{
          label: 'Doanh thu (triệu ₫)',
          data: [5, 9, 7, 11, 8, 13],
          borderColor: 'rgb(34,197,94)',
          fill: false,
          tension: 0.3
        }]
      }
    });
  </script>

</body>
</html>
