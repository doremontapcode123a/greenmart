<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Quên mật khẩu</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-green-50 flex justify-center items-center min-h-screen">
  <div class="w-full max-w-md bg-white p-8 rounded-2xl shadow-lg">
    <h2 class="text-2xl font-bold text-center text-green-700 mb-6">Quên mật khẩu</h2>
    <form method="POST">
      {% csrf_token %}
      <label class="block mb-2 text-sm font-medium text-gray-700">Nhập email</label>
      <input type="email" name="email" placeholder="email@example.com"
             class="w-full px-4 py-2 border rounded-lg mb-4 focus:outline-none focus:ring-2 focus:ring-green-500" required>
      <button type="submit"
              class="w-full bg-green-600 text-white py-2 rounded-lg hover:bg-green-700">
        Gửi link đặt lại mật khẩu
      </button>
    </form>
    <p class="text-center text-sm mt-4">
      <a href="{% url 'loginn' %}" class="text-green-600 hover:underline">Quay lại đăng nhập</a>
    </p>
  </div>
</body>
</html>
