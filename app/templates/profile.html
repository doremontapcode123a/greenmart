<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Green Grocer - Rau củ sạch</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<header class="bg-green-700 text-white p-4 flex justify-between items-center">
    <a href="{% url 'home' %}" class="text-2xl font-bold">GREEN <span class="text-yellow-300">MART</span></a>
    <a href="{% url 'home' %}" class="bg-yellow-400 text-black px-4 py-2 rounded hover:bg-yellow-300">
      ← Trang chủ
    </a>
  </header>

<div class="max-w-lg mx-auto bg-white p-6 rounded-lg shadow-md mt-8">
  <h2 class="text-2xl font-bold text-green-700 mb-4">Thông tin cá nhân</h2>

  {% if messages %}
  {% for message in messages %}
  <div class="p-3 mb-3 rounded text-green-700 bg-green-100 border border-green-300">{{ message }}</div>
  {% endfor %}
  {% endif %}

  <form method="POST">
    {% csrf_token %}
    {% if profile.full_name %}
    <div class="mb-4">
      <label class="block font-medium">Họ và tên</label>
      <input placeholder="VD:Nguyen Van A" type="text" name="full_name" value="{{ profile.full_name }}" 
             class="w-full border p-2 rounded focus:ring-2 focus:ring-green-400">
    </div>
    {% else %}
    <div class="mb-4">
      <label class="block font-medium">Họ và tên</label>
      <input placeholder="VD:Nguyen Van A" type="text" name="full_name" value="" 
             class="w-full border p-2 rounded focus:ring-2 focus:ring-green-400">
    </div>
    {% endif %}

    {% if profile.phone %}
    <div class="mb-4">
      <label class="block font-medium">Số điện thoại</label>
      <input placeholder="VD:0123456789" type="text" name="phone" value="{{ profile.phone }}" 
             class="w-full border p-2 rounded focus:ring-2 focus:ring-green-400">
    </div>
    {% else %}
    <div class="mb-4">
      <label class="block font-medium">Số điện thoại</label>
      <input placeholder="VD:0123456789" type="text" name="phone" value="" 
             class="w-full border p-2 rounded focus:ring-2 focus:ring-green-400">
    </div>
    {% endif %}

    {% if profile.address %}
    <div class="mb-4">
      <label class="block font-medium">Địa chỉ giao hàng</label>
      <textarea placeholder="VD:123, Đường ABC, Quận XYZ" name="address" rows="3"
                class="w-full border p-2 rounded focus:ring-2 focus:ring-green-400">{{ profile.address }}</textarea>
    </div>
    {% else %}
    <div class="mb-4">
      <label class="block font-medium">Địa chỉ giao hàng</label>
      <textarea placeholder="VD:123, Đường ABC, Quận XYZ" name="address" rows="3"
                class="w-full border p-2 rounded focus:ring-2 focus:ring-green-400"></textarea>
    </div>
    {% endif %}

    <button type="submit" 
            class="bg-green-600 text-white px-5 py-2 rounded hover:bg-green-500">
      Cập nhật
    </button>
  </form>
</div>
