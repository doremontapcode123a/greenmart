<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Đặt lại mật khẩu</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-green-50 flex justify-center items-center min-h-screen">
  <div class="w-full max-w-md bg-white p-8 rounded-2xl shadow-lg">
    <h2 class="text-2xl font-bold text-center text-green-700 mb-6">Đặt lại mật khẩu</h2>
    <form method="POST">
      {% csrf_token %}
      <label class="block mb-2 text-sm font-medium text-gray-700">Mật khẩu mới</label>
      <input type="password" name="new_password1" class="w-full px-4 py-2 border rounded-lg mb-4 focus:outline-none focus:ring-2 focus:ring-green-500" required>
      
      <label class="block mb-2 text-sm font-medium text-gray-700">Xác nhận mật khẩu</label>
      <input type="password" name="new_password2" class="w-full px-4 py-2 border rounded-lg mb-4 focus:outline-none focus:ring-2 focus:ring-green-500" required>
      
      <button type="submit"
              class="w-full bg-green-600 text-white py-2 rounded-lg hover:bg-green-700">
        Đổi mật khẩu
      </button>
    </form>
  </div>
</body>
</html>
